project_id = "church-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

# Edge Function gateway policy is explicit so production deploys cannot silently
# re-enable JWT verification on endpoints that must be callable before a user
# has a session. Application-level handlers still perform their own validation,
# rate limiting, webhook verification, or worker-secret verification as relevant.
[functions.login]
verify_jwt = false

[functions.signup]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false

[functions.password-recovery]
verify_jwt = false

[functions.health]
verify_jwt = false

[functions.public-content]
verify_jwt = false

[functions.public-social-feed]
verify_jwt = false

[functions.public-giving]
verify_jwt = false

[functions.branding]
verify_jwt = false

[functions.church-story]
verify_jwt = false

[functions.payment-events]
verify_jwt = false

[functions.streaming-webhook]
verify_jwt = false

[functions.notification-dispatch]
verify_jwt = false

[functions.workflow-dispatch]
verify_jwt = false

# Sermon playback supports genuinely public published sermons for visitors. The
# handler performs its own RLS-based visibility check before issuing a provider
# playback grant, and authenticates bearer sessions when one is supplied.
[functions.sermon-playback]
verify_jwt = false
