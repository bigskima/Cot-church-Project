project_id = "church-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

# Edge Function gateway policy is explicit so production deploys cannot silently
# re-enable JWT verification on endpoints that must be callable before a user
# has a session. Application-level handlers still perform their own validation,
# rate limiting, webhook verification, or worker-secret verification as relevant.
[functions.login]
verify_jwt = false

[functions.signup]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false

[functions.password-recovery]
verify_jwt = false

# Session refresh accepts an expired access-token state by design. The handler
# validates the refresh token with Supabase Auth server-side and rate-limits
# attempts before returning a rotated session.
[functions.refresh-session]
verify_jwt = false

# Profile endpoints authenticate inside the shared handler so browser clients
# receive consistent CORS/error envelopes even when an access token is expired
# or rejected before the request reaches application code.
[functions.profile]
verify_jwt = false

[functions.profile-avatar]
verify_jwt = false

[functions.health]
verify_jwt = false

[functions.public-content]
verify_jwt = false

[functions.public-social-feed]
verify_jwt = false

# Home is a single optional-auth aggregation contract. Visitors receive public
# content; signed-in Expression members receive public/general plus their exact
# Expression scope after membership validation inside the function.
[functions.home-feed]
verify_jwt = false

[functions.public-birthdays]
verify_jwt = false

# Visitors and authenticated accounts without an Expression can submit prayer
# petitions. The handler performs optional bearer validation, church resolution,
# rate limiting, confidentiality filtering, and moderator authorization itself.
[functions.prayer-requests]
verify_jwt = false

# Playback can be public for published content, while upload actions still require
# a valid bearer session and scoped media.upload authorization inside the handler.
[functions.content-media]
verify_jwt = false

[functions.public-giving]
verify_jwt = false

[functions.branding]
verify_jwt = false

[functions.church-story]
verify_jwt = false

[functions.payment-events]
verify_jwt = false

[functions.streaming-webhook]
verify_jwt = false

[functions.notification-dispatch]
verify_jwt = false

[functions.workflow-dispatch]
verify_jwt = false

# Sermon playback supports genuinely public published sermons for visitors. The
# handler performs its own RLS-based visibility check before issuing a provider
# playback grant, and authenticates bearer sessions when one is supplied.
[functions.sermon-playback]
verify_jwt = false
