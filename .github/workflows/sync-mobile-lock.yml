name: Sync mobile lockfile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/sync-mobile-lock.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Synchronize package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync mobile dependency lockfile"
          git push origin HEAD:main
