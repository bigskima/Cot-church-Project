name: Resolve image picker dependency

on:
  push:
    paths:
      - '.github/workflows/resolve-image-picker.yml'

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Expo SDK compatible image picker
        run: npm install --workspace=@church/mobile expo-image-picker@~57.0.15 --save
      - name: Commit reproducible dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/resolve-image-picker.yml
          git add apps/mobile/package.json package-lock.json
          git commit -m "Add Expo image picker for profile photos"
          git push origin HEAD:main
