name: Generate COT PNG icon

on:
  push:
    branches:
      - fix/android-apk-regressions-20260923
    paths:
      - .github/workflows/generate-cot-icon.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-apk-regressions-20260923

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert COT Family JPEG to a real PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          source = "apps/mobile/assets/cot-family-logo.jpg"
          target = "apps/mobile/assets/cot-family-logo.png"
          image = Image.open(source).convert("RGB")
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          image.save(target, format="PNG", optimize=True)
          with open(target, "rb") as handle:
              signature = handle.read(8)
          if signature != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Generated launcher icon is not a valid PNG")
          print(f"Generated {target}")

      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/cot-family-logo.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: add true PNG COT Family launcher icon [skip ci]"
          git push origin HEAD:fix/android-apk-regressions-20260923
