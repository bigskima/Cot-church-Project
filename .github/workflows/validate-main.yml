name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate API structure
        id: api_check
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run api:check 2>&1 | tee validation-api.log

      - name: Validate application invariants
        id: apps_check
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run apps:check 2>&1 | tee validation-apps.log

      - name: Typecheck Platform Administration
        id: admin_typecheck
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run admin:typecheck 2>&1 | tee validation-admin-typecheck.log

      - name: Typecheck church application
        id: mobile_typecheck
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run mobile:typecheck 2>&1 | tee validation-mobile-typecheck.log

      - name: Verify realtime resource behavior
        id: resource_tests
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run mobile:test:resources 2>&1 | tee validation-resource-tests.log

      - name: Build Platform Administration
        id: admin_build
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run admin:build 2>&1 | tee validation-admin-build.log

      - name: Export church web application
        id: mobile_build
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run mobile:build:web 2>&1 | tee validation-mobile-build.log
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/functions/v1

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics-${{ github.run_id }}
          path: validation-*.log
          if-no-files-found: warn
          retention-days: 5

      - name: Enforce validation gate
        if: always()
        shell: bash
        env:
          API_CHECK: ${{ steps.api_check.outcome }}
          APPS_CHECK: ${{ steps.apps_check.outcome }}
          ADMIN_TYPECHECK: ${{ steps.admin_typecheck.outcome }}
          MOBILE_TYPECHECK: ${{ steps.mobile_typecheck.outcome }}
          RESOURCE_TESTS: ${{ steps.resource_tests.outcome }}
          ADMIN_BUILD: ${{ steps.admin_build.outcome }}
          MOBILE_BUILD: ${{ steps.mobile_build.outcome }}
        run: |
          printf 'api=%s apps=%s admin-typecheck=%s mobile-typecheck=%s resources=%s admin-build=%s mobile-build=%s\n' \
            "$API_CHECK" "$APPS_CHECK" "$ADMIN_TYPECHECK" "$MOBILE_TYPECHECK" "$RESOURCE_TESTS" "$ADMIN_BUILD" "$MOBILE_BUILD"
          test "$API_CHECK" = success \
            && test "$APPS_CHECK" = success \
            && test "$ADMIN_TYPECHECK" = success \
            && test "$MOBILE_TYPECHECK" = success \
            && test "$RESOURCE_TESTS" = success \
            && test "$ADMIN_BUILD" = success \
            && test "$MOBILE_BUILD" = success
