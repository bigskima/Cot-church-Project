name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # This draft branch adds Expo native modules while its root lockfile is being
        # reconciled. npm install still honors the existing lock as the baseline, then
        # resolves only the missing workspace entries so validation can reach typecheck.
        run: npm install --no-audit --no-fund

      - name: Validate API structure
        run: npm run api:check

      - name: Validate application invariants
        run: npm run apps:check

      - name: Typecheck Platform Administration
        run: npm run admin:typecheck

      - name: Typecheck church application
        run: npm run mobile:typecheck

      - name: Verify realtime resource behavior
        run: npm run mobile:test:resources

      - name: Build Platform Administration
        run: npm run admin:build

      - name: Export church web application
        run: npm run mobile:build:web
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/functions/v1
